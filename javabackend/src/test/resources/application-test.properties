spring.application.name=javabackend

# Fail-safe database config to prevent accidental connection to development DB
spring.datasource.url=jdbc:mysql://invalid.invalid:3306/forbidden_test_db
spring.datasource.username=forbidden
spring.datasource.password=forbidden
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
javabackend.jwt.base64-secret=YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYQ==
javabackend.jwt.issuer=web-tutorial
javabackend.jwt.access-token-audience=webtutorial-api
javabackend.jwt.refresh-token-audience=webtutorial-auth
app.bootstrap.admin.enabled=false
app.devops.seeding.enabled=false
app.security.cookies.secure=false
app.security.rate-limit.enabled=false
app.security.rate-limit.maximum-size=100
app.security.rate-limit.cache-ttl=5m
app.security.rate-limit.trust-forwarded-headers=false
app.security.rate-limit.trusted-proxy-hops=1
app.security.rate-limit.login-ip.capacity=3
app.security.rate-limit.login-ip.window=1m
app.security.rate-limit.login-account.capacity=2
app.security.rate-limit.login-account.window=1m
app.security.rate-limit.register.capacity=2
app.security.rate-limit.register.window=1m
app.security.rate-limit.refresh.capacity=2
app.security.rate-limit.refresh.window=1m
app.security.rate-limit.upload.capacity=2
app.security.rate-limit.upload.window=1m
app.security.headers.hsts-enabled=false
app.upload.root=${java.io.tmpdir}/webtutorial-test-uploads
