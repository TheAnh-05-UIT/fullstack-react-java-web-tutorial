spring.application.name=javabackend

# Database configuration
###
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/your_db_name}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
###

# Port Application configuration
server.port=${SERVER_PORT:8080}

# JWT Configuration
# Tạo secret key: openssl rand -base64 64
javabackend.jwt.base64-secret=${JWT_SECRET}
# Access token: 900 = 15 phút
javabackend.jwt.access-token-validity-in-seconds=${JWT_ACCESS_EXPIRY:900}
# Refresh token: 2592000 = 30 ngày
javabackend.jwt.refresh-token-validity-in-seconds=${JWT_REFRESH_EXPIRY:2592000}

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# CORS Allowed Origins (phân cách bằng dấu phẩy)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}