spring.application.name=javabackend

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/webtutorial}
spring.datasource.username=${DB_USERNAME:webtutorial_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

server.port=${SERVER_PORT:8080}

javabackend.jwt.base64-secret=${JWT_SECRET_BASE64}
javabackend.jwt.issuer=${JWT_ISSUER:web-tutorial}
javabackend.jwt.access-token-audience=${JWT_ACCESS_AUDIENCE:webtutorial-api}
javabackend.jwt.refresh-token-audience=${JWT_REFRESH_AUDIENCE:webtutorial-auth}
javabackend.jwt.access-token-validity-in-seconds=${JWT_ACCESS_EXPIRY:900}
javabackend.jwt.refresh-token-validity-in-seconds=${JWT_REFRESH_EXPIRY:2592000}
javabackend.jwt.refresh-concurrency-grace=${JWT_REFRESH_CONCURRENCY_GRACE:3s}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.bootstrap.admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}
app.devops.seeding.enabled=${DEVOPS_SEEDING_ENABLED:false}
