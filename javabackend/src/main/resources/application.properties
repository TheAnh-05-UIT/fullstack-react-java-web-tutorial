spring.application.name=javabackend
logging.pattern.level=requestId=%X{requestId:-none} %5p

spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/webtutorial}
spring.datasource.username=${DB_USERNAME:webtutorial_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

server.port=${SERVER_PORT:8080}

javabackend.jwt.base64-secret=${JWT_SECRET_BASE64}
javabackend.jwt.issuer=${JWT_ISSUER:web-tutorial}
javabackend.jwt.access-token-audience=${JWT_ACCESS_AUDIENCE:webtutorial-api}
javabackend.jwt.refresh-token-audience=${JWT_REFRESH_AUDIENCE:webtutorial-auth}
javabackend.jwt.access-token-validity-in-seconds=${JWT_ACCESS_EXPIRY:900}
javabackend.jwt.refresh-token-validity-in-seconds=${JWT_REFRESH_EXPIRY:2592000}
javabackend.jwt.refresh-concurrency-grace=${JWT_REFRESH_CONCURRENCY_GRACE:3s}

spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:5MB}

app.upload.root=${UPLOAD_ROOT:./data/uploads}
app.upload.max-file-size=${UPLOAD_MAX_FILE_SIZE:5MB}
app.upload.max-width=${UPLOAD_MAX_WIDTH:4096}
app.upload.max-height=${UPLOAD_MAX_HEIGHT:4096}
app.upload.max-pixels=${UPLOAD_MAX_PIXELS:16000000}
app.upload.allowed-types=image/jpeg,image/png
app.upload.allowed-folders=general,tutorials,projects,roadmaps,users

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.security.cookies.refresh-name=refresh_token
app.security.cookies.secure=${REFRESH_COOKIE_SECURE:true}
app.security.cookies.same-site=${REFRESH_COOKIE_SAME_SITE:Lax}
app.security.cookies.path=/api/v1
app.security.cookies.domain=${REFRESH_COOKIE_DOMAIN:}
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.security.rate-limit.maximum-size=${RATE_LIMIT_MAXIMUM_SIZE:10000}
app.security.rate-limit.cache-ttl=${RATE_LIMIT_CACHE_TTL:2h}
app.security.rate-limit.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:false}
app.security.rate-limit.trusted-proxy-hops=${TRUSTED_PROXY_HOPS:1}
app.security.rate-limit.login-ip.capacity=${LOGIN_RATE_LIMIT_IP_CAPACITY:20}
app.security.rate-limit.login-ip.window=${LOGIN_RATE_LIMIT_IP_WINDOW:5m}
app.security.rate-limit.login-account.capacity=${LOGIN_FAILURE_LIMIT_CAPACITY:5}
app.security.rate-limit.login-account.window=${LOGIN_FAILURE_LIMIT_WINDOW:15m}
app.security.rate-limit.register.capacity=${REGISTER_RATE_LIMIT_CAPACITY:5}
app.security.rate-limit.register.window=${REGISTER_RATE_LIMIT_WINDOW:1h}
app.security.rate-limit.refresh.capacity=${REFRESH_RATE_LIMIT_CAPACITY:30}
app.security.rate-limit.refresh.window=${REFRESH_RATE_LIMIT_WINDOW:1m}
app.security.rate-limit.upload.capacity=${UPLOAD_RATE_LIMIT_CAPACITY:20}
app.security.rate-limit.upload.window=${UPLOAD_RATE_LIMIT_WINDOW:1m}
app.security.headers.content-security-policy=default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'
app.security.headers.permissions-policy=camera=(), microphone=(), geolocation=()
app.security.headers.hsts-enabled=${HSTS_ENABLED:false}
app.security.headers.hsts-max-age=${HSTS_MAX_AGE:365d}
app.bootstrap.admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}
app.devops.seeding.enabled=${DEVOPS_SEEDING_ENABLED:false}
