# Run from javabackend/ with: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=dev
# The first import supports that working directory; the second supports running from the repository root.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${DB_PORT:3306}/${MYSQL_DATABASE:webtutorial}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:${MYSQL_USER:webtutorial_app}}
spring.datasource.password=${DB_PASSWORD:${MYSQL_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
