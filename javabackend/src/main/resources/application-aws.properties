spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=false

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

app.storage.type=${APP_STORAGE_TYPE:s3}
app.storage.s3-bucket=${APP_STORAGE_S3_BUCKET}
app.storage.s3-prefix=${APP_STORAGE_S3_PREFIX:uploads/images}
app.storage.aws-region=${AWS_REGION}
app.bootstrap.admin.enabled=false
app.devops.seeding.enabled=${DEVOPS_SEEDING_ENABLED:false}

app.security.cookies.secure=true
app.security.rate-limit.trust-forwarded-headers=true
app.security.headers.hsts-enabled=true
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${APP_SHUTDOWN_TIMEOUT:30s}

logging.file.name=
logging.file.path=
