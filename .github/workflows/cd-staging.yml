name: CD - Staging

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character SHA already verified by the CI Quality gate
        required: true
        type: string

concurrency:
  group: cd-staging
  cancel-in-progress: false

permissions:
  checks: read
  contents: read

jobs:
  authorize:
    name: Authorize tested main commit
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit_sha }}

      - name: Validate commit and CI result
        id: commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate="$WORKFLOW_SHA"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            candidate="$INPUT_SHA"
          fi
          if [[ ! "$candidate" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "A full 40-character commit SHA is required." >&2
            exit 1
          fi
          candidate="$(git rev-parse "${candidate}^{commit}")"
          git merge-base --is-ancestor "$candidate" origin/main

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            quality_result="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/commits/${candidate}/check-runs" \
              --jq '[.check_runs[] | select(.name == "Quality gate" and .conclusion == "success")] | length')"
            [[ "$quality_result" -ge 1 ]]
          fi

          echo "sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "Authorized tested main commit ${candidate}."

  deploy-backend:
    name: Deploy backend to AWS
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.sha }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ needs.authorize.outputs.sha }}
        run: |
          cd javabackend
          docker build -t $REGISTRY/$REPOSITORY:latest -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:latest
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Run Database Migration Task
        env:
          CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          SERVICE_NAME: ${{ vars.ECS_SERVICE_NAME }}
        run: |
          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster $CLUSTER_NAME \
            --services $SERVICE_NAME \
            --query 'services[0].networkConfiguration' \
            --output json)
          
          echo "Starting Migration Task..."
          TASK_ARN=$(aws ecs run-task \
            --cluster $CLUSTER_NAME \
            --task-definition web-tutorial-staging-migration \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --query 'tasks[0].taskArn' \
            --output text)
            
          echo "Waiting for Migration Task ($TASK_ARN) to complete..."
          aws ecs wait tasks-stopped --cluster $CLUSTER_NAME --tasks $TASK_ARN
          
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster $CLUSTER_NAME \
            --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)
            
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration Task FAILED with exit code: $EXIT_CODE"
            exit 1
          fi
          echo "Migration SUCCESSFUL!"

      - name: Force new ECS deployment
        env:
          CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          SERVICE_NAME: ${{ vars.ECS_SERVICE_NAME }}
        run: |
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $SERVICE_NAME \
            --force-new-deployment

  deploy-frontend:
    name: Deploy frontend to AWS
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.sha }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend static files
        working-directory: frontend
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync static files to Amazon S3
        env:
          BUCKET_NAME: ${{ vars.S3_FRONTEND_BUCKET }}
        working-directory: frontend
        run: |
          aws s3 sync ./dist s3://$BUCKET_NAME --delete

      - name: Invalidate CloudFront CDN Cache
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*"
