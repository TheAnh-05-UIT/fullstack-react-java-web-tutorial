services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:?MYSQL_DATABASE is required}"
      MYSQL_USER: "${MYSQL_USER:?MYSQL_USER is required}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - staging_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - staging-internal

  backend:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: "jdbc:mysql://db:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8"
      DB_USERNAME: "${MYSQL_USER:?MYSQL_USER is required}"
      DB_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}"
      JWT_SECRET_BASE64: "${JWT_SECRET_BASE64:?JWT_SECRET_BASE64 is required}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}"
      REFRESH_COOKIE_SECURE: "true"
      REFRESH_COOKIE_SAME_SITE: "${REFRESH_COOKIE_SAME_SITE:-Lax}"
      REFRESH_COOKIE_DOMAIN: "${REFRESH_COOKIE_DOMAIN:-}"
      TRUST_FORWARDED_HEADERS: "${TRUST_FORWARDED_HEADERS:-true}"
      TRUSTED_PROXY_HOPS: "${TRUSTED_PROXY_HOPS:-1}"
      UPLOAD_ROOT: /app/data/uploads
      ADMIN_BOOTSTRAP_ENABLED: "false"
      DEVOPS_SEEDING_ENABLED: "false"
    volumes:
      - staging_upload_data:/app/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/v1/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 45s
    networks:
      - staging-internal

  frontend:
    image: "${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${STAGING_HTTP_PORT:-8088}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - staging-internal

volumes:
  staging_mysql_data:
    name: webtutorial_staging_mysql_data
  staging_upload_data:
    name: webtutorial_staging_upload_data

networks:
  staging-internal:
    name: webtutorial_staging_internal
    driver: bridge
